services:
  app:
    # Build the image from the Dockerfile in this folder
    build: .
    image: sokopulse:latest
    ports:
      # Host port comes from PORT in your .env file (default 3000)
      - "${PORT:-3000}:3000"
    environment:
      # The app always listens on 3000 inside the container
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SSL: ${DB_SSL:-true}
    # Restart after a crash, unless it was stopped on purpose
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - soko-net

# No database container is included. Configure DATABASE_URL for an external
# PostgreSQL instance, or leave it empty to use in-memory transactions.
networks:
  soko-net:
